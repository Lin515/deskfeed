name: Release

# 只有版本 tag 会走发布：v1.2.3、v1.2.3-rc.1，也接受不带 v 的 1.2.3。
on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已有 tag（例如 v1.2.3）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  BUILD_DIR: build
  DIST_DIR: dist

jobs:
  release-x64:
    name: x64 Release
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        id: version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = "$env:REQUESTED_TAG".Trim()
          $pattern = '^v?(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?(?:\+[0-9A-Za-z][0-9A-Za-z.-]*)?)$'
          $match = [regex]::Match($tag, $pattern)
          if (-not $match.Success) {
              throw "tag '$tag' is not a release version; expected vMAJOR.MINOR.PATCH with an optional suffix"
          }

          $version = $match.Groups['version'].Value
          # 预发布标记只看 '+' 之前的部分：build metadata 里的连字符不算 pre-release。
          $prereleasePart = $version.Split('+', 2)[0]
          $prerelease = if ($prereleasePart.Contains('-')) { 'true' } else { 'false' }

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "prerelease=$prerelease"
          Write-Host "release tag: $tag (version: $version, prerelease: $prerelease)"

      - name: Locate MSVC x64 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
              throw "vswhere.exe not found: $vswhere"
          }

          $installation = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($installation)) {
              throw 'cannot locate a Visual Studio installation with the MSVC x64 toolchain'
          }

          $vcvars = Join-Path $installation.Trim() 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars -PathType Leaf)) {
              throw "vcvars64.bat not found: $vcvars"
          }

          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VCVARS64=$vcvars"
          Write-Host "MSVC environment: $vcvars"

      - name: Configure and build x64 Release
        shell: cmd
        run: |
          chcp 65001 >nul && call "%VCVARS64%" && cmake -S . -B "%BUILD_DIR%" -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build "%BUILD_DIR%" --parallel

      - name: Run CTest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          ctest --test-dir $env:BUILD_DIR --output-on-failure --timeout 600 --no-tests=error
          if ($LASTEXITCODE -ne 0) {
              throw "CTest failed with exit code $LASTEXITCODE"
          }

      - name: Package x64 release
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $PWD '.github/scripts/package-release.ps1') `
              -Tag $env:RELEASE_TAG `
              -BuildDir $env:BUILD_DIR `
              -DistDir $env:DIST_DIR

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: deskfeed-${{ steps.version.outputs.tag }}-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          # `gh release view` 用退出码表示"release 不存在"；不要把它变成终止性错误。
          $PSNativeCommandUseErrorActionPreference = $false

          $assets = @(Get-ChildItem -LiteralPath (Join-Path $PWD $env:DIST_DIR) -File |
              Sort-Object Name |
              ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) {
              throw 'no release assets were produced'
          }

          # 已有 release 时只覆盖资产并同步标题/预发布标记，重跑不会因为 release 已存在而失败。
          gh release view $env:RELEASE_TAG 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "updating existing release $env:RELEASE_TAG"
              gh release upload $env:RELEASE_TAG @assets --clobber
              if ($LASTEXITCODE -ne 0) {
                  throw "gh release upload failed with exit code $LASTEXITCODE"
              }

              # 不改 latest 指向：重跑一个旧 tag 不应该把它重新标成最新发布。
              $editArgs = @('release', 'edit', $env:RELEASE_TAG, '--title', "DeskFeed $env:RELEASE_TAG")
              if ($env:PRERELEASE -eq 'true') {
                  $editArgs += '--prerelease'
              } else {
                  $editArgs += '--prerelease=false'
              }
              gh @editArgs
              if ($LASTEXITCODE -ne 0) {
                  throw "gh release edit failed with exit code $LASTEXITCODE"
              }
          } else {
              Write-Host "creating release $env:RELEASE_TAG"
              $createArgs = @('release', 'create', $env:RELEASE_TAG) + $assets +
                  @('--verify-tag', '--title', "DeskFeed $env:RELEASE_TAG", '--generate-notes')
              if ($env:PRERELEASE -eq 'true') {
                  $createArgs += '--prerelease'
              } else {
                  $createArgs += '--latest'
              }
              gh @createArgs
              if ($LASTEXITCODE -ne 0) {
                  throw "gh release create failed with exit code $LASTEXITCODE"
              }
          }

      - name: Write job summary
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          ZIP_PATH: ${{ steps.package.outputs.zip }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          $zipName = Split-Path -Leaf $env:ZIP_PATH
          @(
              "## DeskFeed $env:RELEASE_TAG (x64)",
              '',
              '- 构建：MSVC / Ninja / Release',
              '- 测试：CTest 全量通过',
              "- 资产：$zipName、SHA256SUMS.txt",
              "- SHA-256：$env:SHA256"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
